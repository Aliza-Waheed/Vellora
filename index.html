<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELLORA - Luxury E-Commerce</title>
    <script>
        // Immediately redirect Live Server / root static visitors to the client dist app
        if (window.location.pathname.endsWith('/') || window.location.pathname.endsWith('/index.html')) {
            window.location.replace('./client/dist/index.html');
        }
    </script>
    <meta http-equiv="refresh" content="0; url=./client/dist/index.html">
    <style>
        body {
            font-family: 'Cinzel', serif, system-ui, sans-serif;
            background-color: #FAF6F0;
            color: #2C1810;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #E8DFD8;
            max-width: 420px;
        }

        h1 {
            color: #D4AF37;
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
        }

        a {
            display: inline-block;
            background: #2C1810;
            color: #D4AF37;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        a:hover {
            background: #D4AF37;
            color: #2C1810;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>VELLORA</h1>
        <p>Redirecting to VELLORA Luxury Storefront...</p>
        <a href="./client/dist/index.html">Open VELLORA Store</a>
    </div>
</body>

</html>
