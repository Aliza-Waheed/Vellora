<head>

  <script>
    // Fallback for static servers (e.g. VS Code Live Server on port 5500) where Vite dev server is not active
    (function () {
      var isViteDev = window.location.port === '3000' || window.location.port === '5173';
      if (!isViteDev && !window.location.pathname.includes('/dist/')) {
        window.location.replace('./dist/index.html');
      }
    })();
  </script>
</head>
